name: Deploy to droplet

# Push to main -> SSH into the droplet, pull, rebuild, restart.
# Also runnable on demand from the Actions tab (e.g. after fixing a bad deploy).
on:
  push:
    branches: [main]
    # Commits that cannot change what the droplet serves. Expect cross-repo
    # CONSISTENCY, not savings: applied to carpark's last 25 pushes this would
    # have skipped none of them.
    #
    # Two exclusions learned the hard way elsewhere, so the reasoning matters
    # more than the list:
    #   - NOT scripts/**. The deploy is how scripts reach the droplet, and they
    #     are run there by hand right after a push.
    #   - NOT any test path. paths-ignore skips the WHOLE workflow, test job
    #     included, which would silence the gate on exactly the commits that
    #     move it.
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "fixtures/**"
      - "LICENSE"
  workflow_dispatch: {}

# Never let two deploys overlap; queue them instead of interrupting a build.
concurrency:
  group: deploy-droplet-side-quests
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DROPLET_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
